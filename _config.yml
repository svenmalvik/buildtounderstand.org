title: Build to Understand
title_lead: Build to
title_emphasis: Understand
description: Explorations, principles, and systems about engineering freedom.
theme_name: Manifold Royal Dark
theme_slug: manifold-royal-dark
# Manifold Royal Dark inherits its structure from the Midnight gem.
theme: jekyll-theme-midnight
markdown: kramdown
permalink: pretty

collections:
  explorations:
    output: true
    permalink: /explorations/:name/
  systems:
    output: true
    permalink: /systems/:name/

defaults:
  - scope:
      path: ""
      type: explorations
    values:
      layout: default
  - scope:
      path: ""
      type: systems
    values:
      layout: default

exclude:
  - AGENTS.md
  - README.md
  - _templates
